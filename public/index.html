<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#09000f">

    <title>PENG.LOL</title>

    <link rel="stylesheet" href="/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <!-- BACKGROUND MUSIC -->
    <iframe
        id="music"
        width="1"
        height="1"
        src="https://www.youtube.com/embed/AsMnEpjgjvA?enablejsapi=1"
        allow="autoplay">
    </iframe>

    <!-- ENTER SCREEN -->
    <div id="enterScreen">

        <div class="enter-content">

            <img
                src="/uploads/profile.gif"
                alt="PENG.LOL Profile"
                class="profile-gif"
            >

            <h1>PENG<span>.LOL</span></h1>

            <p>Welcome to PENG.LOL</p>

            <button id="enterButton">
                CLICK TO ENTER
            </button>

        </div>

    </div>


    <!-- MAIN WEBSITE -->
    <div id="website" style="display:none;">

        <!-- NAVIGATION -->
        <header class="navigation">

            <a href="#" class="logo">
                PENG<span>.LOL</span>
            </a>

            <nav class="nav-center">

                <a href="#home" class="active">Home</a>

                <a href="#tools">Tools</a>

            </nav>

            <a
                href="https://discord.gg/GstNHQ9Ue"
                target="_blank"
                class="discord-button"
            >
                Discord ↗
            </a>

        </header>


        <!-- HOME PAGE -->
        <main id="home">

            <section class="profile-section">

                <img
                    src="/uploads/profile.gif"
                    alt="Profile"
                    class="main-gif"
                >

                <h1>PENG.LOL</h1>

                <p>Mods, tools and more.</p>

            </section>


            <!-- SEARCH -->
            <section class="mod-section" id="mods">

                <h2>Explore Mods</h2>

                <p>Find your favorite mods.</p>

                <div class="search-container">

                    <span>⌕</span>

                    <input
                        type="text"
                        id="search"
                        placeholder="Search for a mod..."
                    >

                </div>

                <select id="sort">
                    <option value="newest">Newest first</option>
                    <option value="downloads">Most downloaded</option>
                    <option value="updated">Recently updated</option>
                </select>


                <!-- MOD LIST -->
                <div id="modGrid" class="mod-grid">

                    <div class="empty-state">
                        Loading mods...
                    </div>

                </div>

            </section>


            <!-- TOOLS PAGE -->
            <section id="tools" class="tools-section">

                <h1>Tools</h1>

                <p>Useful downloads and resources.</p>

                <div id="toolGrid" class="tool-grid">

                    <div class="empty-state">
                        Tools will appear here.
                    </div>

                </div>

            </section>

        </main>


        <!-- FOOTER -->
        <footer>

            <h2>PENG.LOL</h2>

            <p>Made for the community.</p>

            <p class="copyright">
                © <span id="year"></span> PENG.LOL
            </p>

            <!-- OWNER LOGIN AT THE VERY BOTTOM -->
            <div class="owner-section">

                <button id="loginOpen">
                    Owner Login
                </button>

                <button id="signupOpen" style="display:none;">
                    Sign Up
                </button>

                <button id="accountBtn" class="avatar hidden">
                    ?
                </button>

            </div>

        </footer>

    </div>


    <!-- MODAL -->
    <div class="modal-backdrop" id="modalBackdrop">

        <div class="modal" id="modal">

            <button class="modal-close" id="modalClose">
                ×
            </button>

            <div id="modalContent"></div>

        </div>

    </div>


    <!-- NOTIFICATIONS -->
    <div class="toast" id="toast"></div>


    <script src="/app.js"></script>


    <!-- ENTER SCREEN FUNCTION -->
    <script>

        const enterButton =
            document.getElementById("enterButton");

        enterButton.addEventListener("click", function () {

            document.getElementById("enterScreen").style.display = "none";

            document.getElementById("website").style.display = "block";

            const music =
                document.getElementById("music");

            music.contentWindow.postMessage(
                JSON.stringify({
                    event: "command",
                    func: "playVideo",
                    args: []
                }),
                "*"
            );

        });

        document.getElementById("year").textContent =
            new Date().getFullYear();

    </script>

</body>
</html>
